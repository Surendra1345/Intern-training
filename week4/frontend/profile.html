<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Surendra Profile</title>
    <link rel="stylesheet" href="profile.css">
</head>
<body>

    <header>
        <h1>Developer Profile</h1>
    </header>

    <main>

        <section class="profile">
            <img src="/Users/surendrareddy/Desktop/surendra.jpeg" alt="Surendra Profile Picture">

            <div class="content">
                <h2>About Me</h2>
                <p>
                    Hello, this is Surendra. I am a Python Full Stack Software Intern
                    focusing on backend architectures and responsive frontend user interfaces.
                </p>
            </div>
        </section>

        <section class="contact">
            <h2>Contact Me</h2>

            <div class="field">
                <label for="name">Full Name</label>
                <input type="text" id="name" placeholder="Your Name">
            </div>

            <div class="field">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="name@example.com">
            </div>

            <div class="field">
                <label for="message">Message</label>
                <textarea id="message" rows="5" placeholder="Write your message here"></textarea>
            </div>

            <button type="button">Send Message</button>
        </section>

    </main>

    <footer>
        <p>&copy; 2026 Developer Training Program.</p>
    </footer>

</body>
</html>
